name: NexusMind CI

on:
  push:
    branches: [main, datau3-microsoft-foundry-upgrade]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run governance and orchestration unit tests
        run: pytest -q tests/test_governance.py tests/test_memory.py tests/test_enterprise_api.py
