name: NexusMind CI

on:
  push:
    branches: [main, datau3-microsoft-foundry-upgrade]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run governance and orchestration unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Generate deterministic synthetic analytics evidence
        run: python -m analytics.demo
      - name: Upload labelled demo report and dashboard
        uses: actions/upload-artifact@v4
        with:
          name: nexus-analytics-demo-python-${{ matrix.python-version }}
          path: |
            reports/analytics_demo/report.json
            reports/analytics_demo/dashboard.html
            reports/analytics_demo/mart_*.csv
